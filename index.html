<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link id="favicon" rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<title>Science Revisions</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--surface:#111;--surface2:#1a1a1a;--surface3:#222;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.18);--accent:#ffffff;--accent-glow:rgba(255,255,255,0.06);--accent-dim:rgba(255,255,255,0.28);--text:#f0f0f0;--text-muted:#888;--text-dim:#444;--danger:#f7634f;--success:#4ff79a;--warn:#f7c34f;--mono:'Space Mono',monospace;--sans:'Syne',sans-serif;--r:12px;--r-sm:8px;}
[data-theme="blue"]  {--accent:#4f8ef7;--accent-glow:rgba(79,142,247,0.12);--accent-dim:rgba(79,142,247,0.4);}
[data-theme="purple"]{--accent:#9b6ef7;--accent-glow:rgba(155,110,247,0.12);--accent-dim:rgba(155,110,247,0.4);}
[data-theme="red"]   {--accent:#f74f6e;--accent-glow:rgba(247,79,110,0.12);--accent-dim:rgba(247,79,110,0.4);}
[data-theme="green"] {--accent:#4ff79a;--accent-glow:rgba(79,247,154,0.12);--accent-dim:rgba(79,247,154,0.4);}
[data-theme="amber"] {--accent:#f7c34f;--accent-glow:rgba(247,195,79,0.12);--accent-dim:rgba(247,195,79,0.4);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{background:#080808;color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:default;transition:background .4s;}
canvas.bg-canvas{position:fixed;inset:0;pointer-events:none;}
#srv2-bg{z-index:0;}#srv2-fx{z-index:1;}
nav{z-index:100!important;}
.overlay{z-index:200!important;}
#stop-overlay{z-index:9999!important;}
#toast{z-index:9999!important;}
.card{position:relative;z-index:10;width:100%;max-width:400px;margin:1rem;background:rgba(17,17,17,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border2);border-radius:16px;padding:2.25rem 2rem 1.75rem;animation:fadeUp .5s cubic-bezier(0.16,1,.3,1) both;cursor:default;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:1.75rem;}
.logo-mark{width:36px;height:36px;border:1px solid var(--border2);border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--accent-glow);}
.logo-mark svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.logo-name{font-size:14px;font-weight:700;color:var(--text);}
.logo-tag{font-size:10px;color:var(--text-muted);font-family:var(--mono);}
.heading{font-size:21px;font-weight:800;color:var(--text);margin-bottom:3px;letter-spacing:-.02em;}
.subhead{font-size:12px;color:var(--text-muted);font-family:var(--mono);margin-bottom:1.5rem;}
.field{margin-bottom:1rem;}
label{display:block;font-size:10px;font-family:var(--mono);color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.input-wrap{position:relative;}
.input-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-dim);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s;pointer-events:none;}
input[type="text"],input[type="password"]{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px 10px 36px;color:var(--text);font-family:var(--mono);font-size:13px;outline:none;cursor:text;transition:border-color .2s,box-shadow .2s;}
input:focus{border-color:var(--accent-dim);box-shadow:0 0 0 3px var(--accent-glow);}
input:focus+.input-icon{stroke:var(--accent);}
.toggle-pw{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;}
.toggle-pw svg{width:14px;height:14px;stroke:var(--text-dim);fill:none;stroke-width:2;transition:stroke .2s;pointer-events:none;}
.toggle-pw:hover svg{stroke:var(--text-muted);}
.msg-box{display:none;align-items:center;gap:8px;border-radius:8px;padding:9px 12px;font-size:12px;color:var(--danger);font-family:var(--mono);margin-bottom:1rem;background:rgba(247,99,79,.07);border:1px solid rgba(247,99,79,.2);}
.msg-box.show{display:flex;animation:shake .35s ease;}
.msg-box svg{width:13px;height:13px;stroke:var(--danger);fill:none;stroke-width:2;flex-shrink:0;}
.locked-box{display:none;flex-direction:column;align-items:center;text-align:center;gap:7px;border-radius:8px;padding:1rem;margin-bottom:1rem;background:rgba(247,99,79,.06);border:1px solid rgba(247,99,79,.2);}
.locked-box.show{display:flex;}
.locked-box svg{width:24px;height:24px;stroke:var(--danger);fill:none;stroke-width:2;}
.locked-box p{font-size:12px;color:var(--danger);font-family:var(--mono);}
.locked-box span{font-size:11px;color:var(--text-muted);font-family:var(--mono);}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.btn{width:100%;padding:11px;background:var(--accent);color:#000;border:none;border-radius:8px;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s,box-shadow .2s;}
.btn:hover{opacity:.85;box-shadow:0 0 18px var(--accent-dim);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.3;cursor:default;}
.btn .spinner{display:none;width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:spin .5s linear infinite;margin:0 auto;}
.btn.loading .btn-text{display:none;}.btn.loading .spinner{display:block;}
@keyframes spin{to{transform:rotate(360deg);}}
.divider{display:flex;align-items:center;gap:8px;margin:1.25rem 0 1rem;color:var(--text-dim);font-size:10px;font-family:var(--mono);letter-spacing:.06em;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.themes{display:flex;align-items:center;justify-content:center;gap:8px;}
.themes-label{font-size:10px;color:var(--text-muted);font-family:var(--mono);margin-right:2px;}
.s-dot{width:16px;height:16px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;}
.s-dot:hover{transform:scale(1.2);box-shadow:0 0 8px rgba(255,255,255,.25);}
.s-dot.active{border-color:var(--text);transform:scale(1.15);}
.s-dot[data-t="bw"]{background:linear-gradient(135deg,#fff 50%,#222 50%);}
.s-dot[data-t="blue"]{background:#4f8ef7;}.s-dot[data-t="purple"]{background:#9b6ef7;}
.s-dot[data-t="red"]{background:#f74f6e;}.s-dot[data-t="green"]{background:#4ff79a;}.s-dot[data-t="amber"]{background:#f7c34f;}

#warning-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.9);z-index:5000;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:1.5rem;width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:warnIn .3s cubic-bezier(0.16,1,0.3,1) forwards;display:none;}
#warning-popup.show{display:block;}
#warning-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:4999;display:none;backdrop-filter:blur(4px);}
#warning-overlay.show{display:block;}
@keyframes warnIn{from{opacity:0;transform:translate(-50%,-50%) scale(0.9);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
.warn-icon{font-size:32px;margin-bottom:.75rem;}
.warn-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:.5rem;}
.warn-text{font-size:12px;color:var(--text-muted);font-family:var(--mono);line-height:1.6;margin-bottom:1.25rem;}
.warn-close{padding:7px 28px;background:var(--accent);color:#000;border:none;border-radius:20px;font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;}

.remember-row{display:flex;align-items:center;gap:10px;margin-bottom:1.1rem;}
.remember-row input[type=checkbox]{display:none;}
.remember-toggle{width:36px;height:20px;background:var(--surface3);border:1px solid var(--border2);border-radius:20px;cursor:pointer;position:relative;transition:background .2s,border-color .2s;flex-shrink:0;}
.remember-toggle::after{content:'';position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#666;transition:transform .2s,background .2s;}
.remember-row input:checked+.remember-toggle{background:var(--accent);border-color:var(--accent);}
.remember-row input:checked+.remember-toggle::after{transform:translateX(16px);background:#000;}
.remember-label{font-size:11px;font-family:var(--mono);color:var(--text-muted);cursor:pointer;user-select:none;transition:color .2s;}
.remember-row input:checked~.remember-label{color:var(--text);}
</style>
</head>
<body>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<div id="warning-overlay"></div>
<div id="warning-popup">
  <div class="warn-icon">🎵</div>
  <div class="warn-title">Heads up!</div>
  <p class="warn-text">There is music playing in the background!</p>
  <button class="warn-close" onclick="closeWarning()">Got it</button>
</div>
<canvas id="srv2-bg" class="bg-canvas"></canvas>
<canvas id="srv2-fx" class="bg-canvas"></canvas>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg></div>

  </div>

  <div class="msg-box" id="error-box"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg><span id="error-text">Incorrect username or password.</span></div>
  <div class="locked-box" id="locked-box"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><p>Account locked.</p><span>Contact the site owner to regain access.</span></div>

    </div>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
      <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <button class="toggle-pw" id="toggle-pw" type="button" tabindex="-1">
        <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>

  </div>
  <button class="btn" id="login-btn" type="button"><span class="btn-text">Sign In</span><div class="spinner"></div></button>
  <div class="divider">theme</div>
  <div class="themes">
    <span class="themes-label">color —</span>
    <div class="s-dot active" data-t="bw"></div><div class="s-dot" data-t="blue"></div><div class="s-dot" data-t="purple"></div><div class="s-dot" data-t="red"></div><div class="s-dot" data-t="green"></div><div class="s-dot" data-t="amber"></div>
  </div>
</div>
<button id="cloak-login-btn" type="button" style="position:fixed;bottom:1.25rem;right:1.25rem;z-index:300;padding:6px 14px;background:rgba(17,17,17,.92);border:1px solid var(--border2);border-radius:20px;color:var(--text-muted);font-family:var(--mono);font-size:11px;cursor:pointer;transition:border-color .2s,color .2s,box-shadow .2s;backdrop-filter:blur(12px);letter-spacing:.04em;">👻 cloak — esc</button>
<script>
window.addEventListener('DOMContentLoaded',function(){
  var cfg={apiKey:"AIzaSyAa-fN7WNj46UznXEOO0CsyKX8j8kCokhQ",authDomain:"science-revisions-v2.firebaseapp.com",projectId:"science-revisions-v2",storageBucket:"science-revisions-v2.firebasestorage.app",messagingSenderId:"950664248443",appId:"1:950664248443:web:8e57782d5b0ba7ff6cf6de"};firebase.initializeApp(cfg);var auth=firebase.auth(),db=firebase.firestore();
    /* ═══ BACKGROUND ENGINE v3 ═══ */
  var _bgC=document.getElementById('srv2-bg'),_fxC=document.getElementById('srv2-fx');
  var _bgX=_bgC.getContext('2d'),_fxX=_fxC.getContext('2d');
  var _W,_H,_mouse={x:-999,y:-999},_lastMx=-999,_lastMy=-999;
  var _GRID=52,_dots=[],_shapes=[],_ripples=[],_spawnT=0,_t=0;

  var _shapesOn=localStorage.getItem('srv2-shapes')!=='0';
  var _dotsOn=localStorage.getItem('srv2-dots')!=='0';
  var _repelDist=parseInt(localStorage.getItem('srv2-repel')||'110');

  function _resize(){_W=_bgC.width=_fxC.width=window.innerWidth;_H=_bgC.height=_fxC.height=window.innerHeight;_buildDots();}
  function _buildDots(){
    _dots=[];
    var cols=Math.ceil(_W/_GRID)+2,rows=Math.ceil(_H/_GRID)+2;
    for(var r=0;r<rows;r++){for(var c=0;c<cols;c++){
      _dots.push({ox:c*_GRID,oy:r*_GRID,x:c*_GRID,y:r*_GRID,vx:0,vy:0,phase:Math.random()*Math.PI*2});
    }}
  }

  /* CLICK — water ripple + shapes burst */
  window.addEventListener('click',function(e){
    /* Multiple concentric ripple rings for water effect */
    _ripples.push({x:e.clientX,y:e.clientY,r:0,maxR:Math.max(_W,_H)*1.6,a:0.7,speed:7,ring:0});
    _ripples.push({x:e.clientX,y:e.clientY,r:0,maxR:Math.max(_W,_H)*1.6,a:0.45,speed:7,ring:1,delay:8});
    _ripples.push({x:e.clientX,y:e.clientY,r:0,maxR:Math.max(_W,_H)*1.6,a:0.25,speed:7,ring:2,delay:18});
    /* 5-6 shapes burst - wave speed, travel further, linear decel + drop */
    if(_shapesOn){
      var count=8+Math.floor(Math.random()*4);
      for(var i=0;i<count;i++){
        var angle=(Math.PI*2/count)*i+(Math.random()-.5)*0.4;
        var spd=4+Math.random()*2; /* slightly shorter travel */
        _shapes.push({x:e.clientX,y:e.clientY,
          vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,
          rot:Math.random()*Math.PI*2,vrot:(Math.random()-.5)*.06,
          sz:12+Math.random()*12,type:['sq','tri','plus','diamond','hex','arrow','circle','star','zigzag'][Math.floor(Math.random()*9)],
          a:.75+Math.random()*.2,fromClick:true,dropping:false});
      }
    }
  });

  function _spawnShape(){
    _shapes.push({x:_mouse.x,y:_mouse.y,
      vx:(Math.random()-.5)*1.0,vy:.7+Math.random()*1.3,
      rot:Math.random()*Math.PI*2,vrot:(Math.random()-.5)*.07,
      sz:11+Math.random()*11,type:['sq','tri','plus','diamond','hex','arrow','circle','star','zigzag'][Math.floor(Math.random()*9)],
      a:.45+Math.random()*.3,fromClick:false});
  }

  function _drawGrid(){
    _bgX.clearRect(0,0,_W,_H);
    _bgX.strokeStyle='rgba(255,255,255,0.04)';_bgX.lineWidth=.5;
    var cols=Math.ceil(_W/_GRID)+2,rows=Math.ceil(_H/_GRID)+2;
    for(var c=0;c<cols;c++){_bgX.beginPath();_bgX.moveTo(c*_GRID,0);_bgX.lineTo(c*_GRID,_H);_bgX.stroke();}
    for(var r=0;r<rows;r++){_bgX.beginPath();_bgX.moveTo(0,r*_GRID);_bgX.lineTo(_W,r*_GRID);_bgX.stroke();}
    if(!_dotsOn)return;
    _dots.forEach(function(d){
      var dx=d.x-d.ox,dy=d.y-d.oy,moved=Math.sqrt(dx*dx+dy*dy);
      var alpha=0.13+Math.min(moved/10,1)*0.5;
      var rad=1.3+Math.min(moved/14,1)*1.7;
      _bgX.beginPath();_bgX.arc(d.x,d.y,rad,0,Math.PI*2);
      _bgX.fillStyle='rgba(255,255,255,'+alpha+')';_bgX.fill();
    });
  }

  function _updateDots(){
    _t+=0.016;
    _dots.forEach(function(d){
      /* ambient wave - always present, smooth sine */
      var waveX=Math.sin(_t*0.9+d.phase)*2.5;
      var waveY=Math.cos(_t*0.65+d.phase*1.4)*2.5;
      /* mouse repel */
      var dx=d.x-_mouse.x,dy=d.y-_mouse.y,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<_repelDist&&dist>0){var f=(_repelDist-dist)/_repelDist;d.vx+=(dx/dist)*f*2.2;d.vy+=(dy/dist)*f*2.2;}
      /* water ripple push — wide ring that travels outward */
      _ripples.forEach(function(rp){
        if(rp.delay&&rp.r<rp.delay*rp.speed)return;
        var rdx=d.ox-rp.x,rdy=d.oy-rp.y,rdist=Math.sqrt(rdx*rdx+rdy*rdy);
        var ringWidth=40;
        var diff=Math.abs(rdist-rp.r);
        if(diff<ringWidth&&rdist>0){
          var strength=(1-diff/ringWidth)*3.5*rp.a;
          d.vx+=(rdx/rdist)*strength;d.vy+=(rdy/rdist)*strength;
        }
      });
      /* spring to wave origin */
      d.vx+=(d.ox+waveX-d.x)*0.055;d.vy+=(d.oy+waveY-d.y)*0.055;
      d.vx*=0.73;d.vy*=0.73;d.x+=d.vx;d.y+=d.vy;
    });
    /* advance ripples */
    _ripples=_ripples.filter(function(rp){
      rp.r+=rp.speed;rp.a*=0.965;
      return rp.r<rp.maxR&&rp.a>0.005;
    });
  }

  function _drawFx(){
    _fxX.clearRect(0,0,_W,_H);



    /* SHAPES */
    if(_shapesOn){
      _shapes=_shapes.filter(function(s){
        if(s.fromClick){return s.a>0.02&&s.y<_H+80;}
        return s.y<_H+50&&s.a>0.02;
      });
      _shapes.forEach(function(s){
        s.x+=s.vx;s.y+=s.vy;
        if(!s.fromClick){
          s.vy+=0.03; /* cursor shapes fall */
        } else {
          var spd=Math.sqrt(s.vx*s.vx+s.vy*s.vy);
          if(spd>0.4){
            /* linear deceleration - same rate for all directions */
            s.vx*=0.965;s.vy*=0.965;
          } else {
            /* slow enough - now drop down and fade */
            s.dropping=true;
            s.vx*=0.97;
            s.vy+=0.08; /* gravity kicks in */
          }
        }
        s.rot+=s.vrot;s.a*=s.fromClick?(s.dropping?0.972:0.993):0.983;
        _fxX.save();_fxX.translate(s.x,s.y);_fxX.rotate(s.rot);
        _fxX.globalAlpha=s.a;_fxX.strokeStyle='rgba(255,255,255,1)';
        _fxX.lineWidth=1.2;_fxX.shadowBlur=7;_fxX.shadowColor='rgba(255,255,255,0.5)';
        var h=s.sz/2;
        if(s.type==='sq'){
          _fxX.strokeRect(-h,-h,s.sz,s.sz);
        } else if(s.type==='tri'){
          _fxX.beginPath();_fxX.moveTo(0,-h*.9);_fxX.lineTo(h*.8,h*.7);_fxX.lineTo(-h*.8,h*.7);_fxX.closePath();_fxX.stroke();
        } else if(s.type==='plus'){
          var t=h*.3;
          _fxX.beginPath();_fxX.moveTo(-t,-h);_fxX.lineTo(t,-h);_fxX.lineTo(t,-t);_fxX.lineTo(h,-t);_fxX.lineTo(h,t);_fxX.lineTo(t,t);_fxX.lineTo(t,h);_fxX.lineTo(-t,h);_fxX.lineTo(-t,t);_fxX.lineTo(-h,t);_fxX.lineTo(-h,-t);_fxX.lineTo(-t,-t);_fxX.closePath();_fxX.stroke();
        } else if(s.type==='diamond'){
          _fxX.beginPath();_fxX.moveTo(0,-h);_fxX.lineTo(h*.7,0);_fxX.lineTo(0,h);_fxX.lineTo(-h*.7,0);_fxX.closePath();_fxX.stroke();
        } else if(s.type==='hex'){
          _fxX.beginPath();
          for(var hi=0;hi<6;hi++){var ha=Math.PI/180*(60*hi-30);_fxX[hi===0?'moveTo':'lineTo'](h*Math.cos(ha),h*Math.sin(ha));}
          _fxX.closePath();_fxX.stroke();
        } else if(s.type==='arrow'){
          _fxX.beginPath();_fxX.moveTo(0,-h);_fxX.lineTo(h*.6,0);_fxX.lineTo(h*.25,0);_fxX.lineTo(h*.25,h);_fxX.lineTo(-h*.25,h);_fxX.lineTo(-h*.25,0);_fxX.lineTo(-h*.6,0);_fxX.closePath();_fxX.stroke();
        } else if(s.type==='circle'){
          _fxX.beginPath();_fxX.arc(0,0,h*.8,0,Math.PI*2);_fxX.stroke();
        } else if(s.type==='star'){
          _fxX.beginPath();
          for(var si=0;si<10;si++){var sr=si%2===0?h:h*.45;var sa=Math.PI/5*si-Math.PI/2;_fxX[si===0?'moveTo':'lineTo'](sr*Math.cos(sa),sr*Math.sin(sa));}
          _fxX.closePath();_fxX.stroke();
        } else if(s.type==='zigzag'){
          var segs=4;var sw=h*1.6/segs;
          _fxX.beginPath();_fxX.moveTo(-h*.8,-h*.4);
          for(var zi=0;zi<=segs;zi++){_fxX.lineTo(-h*.8+zi*sw,zi%2===0?-h*.4:h*.4);}
          _fxX.stroke();
        }
        _fxX.restore();_fxX.globalAlpha=1;
      });
    }
  }

  function _bgLoop(){_updateDots();_drawGrid();_drawFx();requestAnimationFrame(_bgLoop);}
  window.addEventListener('resize',_resize);
  window.addEventListener('mousemove',function(e){
    _mouse.x=e.clientX;_mouse.y=e.clientY;


    if(_shapesOn){var mdx=e.clientX-_lastMx,mdy=e.clientY-_lastMy,spd=Math.sqrt(mdx*mdx+mdy*mdy);_spawnT++;if(spd>5&&_spawnT>5&&_shapes.length<80){_spawnShape();_spawnT=0;}_lastMx=e.clientX;_lastMy=e.clientY;}
  });
  _resize();_bgLoop();

  window.setBgShapes=function(v){_shapesOn=v;localStorage.setItem('srv2-shapes',v?'1':'0');};
  window.setBgDots=function(v){_dotsOn=v;localStorage.setItem('srv2-dots',v?'1':'0');};
  window.setBgRepel=function(v){_repelDist=parseInt(v);localStorage.setItem('srv2-repel',v);};
  var _bgToggles={shapes:_shapesOn,dots:_dotsOn};
  function _syncToggleUI(){['shapes','dots'].forEach(function(k){var b=document.getElementById('tog-'+k);if(b){b.textContent=_bgToggles[k]?'ON':'OFF';b.style.background=_bgToggles[k]?'var(--accent)':'var(--surface3)';b.style.color=_bgToggles[k]?'#000':'var(--text-muted)';}});var rs=document.getElementById('repel-slider');if(rs){rs.value=_repelDist;document.getElementById('repel-val').textContent=_repelDist;}}
  window.toggleBgSetting=function(k){_bgToggles[k]=!_bgToggles[k];if(k==='shapes')setBgShapes(_bgToggles[k]);else if(k==='dots')setBgDots(_bgToggles[k]);_syncToggleUI();toast(_bgToggles[k]?k+' on':k+' off');};
  _syncToggleUI();
  /* ═══ END BACKGROUND ENGINE v3 ═══ */
  /* END BACKGROUND ENGINE */
  var BG_C={bw:'#080808',blue:'#03050f',purple:'#06030f',red:'#0f0305',green:'#030f07',amber:'#0f0a03'};
  function applyTheme(t){document.querySelectorAll('.s-dot').forEach(function(d){d.classList.remove('active');});var dot=document.querySelector('.s-dot[data-t="'+t+'"]');if(dot)dot.classList.add('active');if(t==='bw')document.body.removeAttribute('data-theme');else document.body.dataset.theme=t;document.body.style.background=BG_C[t]||BG_C.bw;localStorage.setItem('srv2-theme',t);}
  document.querySelectorAll('.s-dot').forEach(function(d){d.addEventListener('click',function(e){e.stopPropagation();applyTheme(d.dataset.t);});});
  applyTheme(localStorage.getItem('srv2-theme')||'bw');
  var pwInput=document.getElementById('password');
  var EO='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
  var EC='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
  document.getElementById('toggle-pw').addEventListener('click',function(e){e.stopPropagation();var h=pwInput.type==='password';pwInput.type=h?'text':'password';document.getElementById('eye-icon').innerHTML=h?EC:EO;});
  var btn=document.getElementById('login-btn'),errorBox=document.getElementById('error-box'),errorText=document.getElementById('error-text'),lockedBox=document.getElementById('locked-box');
  function showError(msg){errorText.textContent=msg;lockedBox.classList.remove('show');errorBox.classList.remove('show');void errorBox.offsetWidth;errorBox.classList.add('show');}
  function showLocked(){errorBox.classList.remove('show');lockedBox.classList.add('show');}
  btn.addEventListener('click',async function(){
    var username=document.getElementById('username').value.trim().toLowerCase();
    var password=pwInput.value;
    if(!username||!password){showError('Please fill in all fields.');return;}
    var remember=document.getElementById('remember-me').checked;
    var persistence=remember?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION;
    btn.classList.add('loading');btn.disabled=true;errorBox.classList.remove('show');lockedBox.classList.remove('show');
    try{
      var snap=await db.collection('users').where('username','==',username).limit(1).get();
      if(snap.empty){btn.classList.remove('loading');btn.disabled=false;showError('Incorrect username or password.');return;}
      var doc=snap.docs[0],data=doc.data();
      if(data.locked===true){btn.classList.remove('loading');btn.disabled=false;showLocked();return;}
      await auth.setPersistence(persistence);
      await auth.signInWithEmailAndPassword(data.email,password);
      localStorage.setItem('srv2-role',data.role);localStorage.setItem('srv2-username',data.username);localStorage.setItem('srv2-uid',doc.id);
      localStorage.setItem('srv2-handoff', JSON.stringify({role:data.role,username:data.username,uid:doc.id,ts:Date.now()}));
      var target=data.role==='owner'?'owner.html':data.role==='admin'?'admin.html':'home.html';
      if(window.opener&&window.opener._loadPage){
        window.opener._loadPage(target);
      } else {
        window.location.href=target;
      }
    }catch(err){
      btn.classList.remove('loading');btn.disabled=false;
      if(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential')showError('Incorrect username or password.');
      else if(err.code==='auth/too-many-requests')showError('Too many attempts. Try again later.');
      else{showError('Something went wrong.');console.error(err);}
    }
  });
  document.addEventListener('keydown',function(e){if(e.key==='Enter')btn.click();if(e.key==='Escape')doLoginCloak();});
  function doLoginCloak(){var cloakURL=localStorage.getItem('srv2-cloak-url')||'https://classroom.google.com/';window.open(cloakURL,'_blank');}
  document.getElementById('cloak-login-btn').addEventListener('click',doLoginCloak);
  document.getElementById('cloak-login-btn').addEventListener('mouseover',function(){this.style.borderColor='var(--accent-dim)';this.style.color='var(--text)';this.style.boxShadow='0 0 12px var(--accent-glow)';});
  document.getElementById('cloak-login-btn').addEventListener('mouseout',function(){this.style.borderColor='var(--border)';this.style.color='var(--text-muted)';this.style.boxShadow='';});
  // onAuthStateChanged: only redirect if this tab was already logged in before (not after new-tab login)
  auth.onAuthStateChanged(function(user){
    if(user){
      /* Check localStorage first */
      var r=localStorage.getItem('srv2-role');
      function doRedirect(role){
        var t=role==='owner'?'owner.html':role==='admin'?'admin.html':'home.html';
        if(window.opener&&window.opener._loadPage){window.opener._loadPage(t);}
        else{window.location.href=t;}
      }
      if(r){doRedirect(r);return;}
      /* localStorage empty (remembered login) - fetch role from Firestore */
      db.collection('users').doc(user.uid).get().then(function(snap){
        if(!snap.exists){auth.signOut();return;}
        var data=snap.data();
        if(data.locked===true){auth.signOut();return;}
        localStorage.setItem('srv2-role',data.role);
        localStorage.setItem('srv2-username',data.username);
        localStorage.setItem('srv2-uid',user.uid);
        doRedirect(data.role);
      }).catch(function(){});
    }
  });
  /* Show warning before login */
  function showWarning(){document.getElementById('warning-popup').classList.add('show');document.getElementById('warning-overlay').classList.add('show');}
  window.closeWarning=function(){document.getElementById('warning-popup').classList.remove('show');document.getElementById('warning-overlay').classList.remove('show');};
  setTimeout(showWarning,600);
});
</script>
